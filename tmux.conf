# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator

set -g mouse on
# All the colors
set -g default-terminal "screen-256color"

# No window renaming
set-option -g allow-rename off

# Status bar settings
set -g status-right '%d-%m-%Y %H:%M '
set -g status-left-length 50
set -g status-left ' Session #{session_name} on #{host_short}'
#Center the window list
set-window-option -g window-status-current-format '#{window_index}-#{window_name}'
set-window-option -g window-status-format '#{window_index}-#{window_name}'
#set-window-option -g window-status-activity-style bg=red
#set-window-option -g window-status-current-style bg=red
set -g status-justify centre

# Start counting pane and window number at 1
set -g base-index 1
setw -g pane-base-index 1

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' {
  "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
}
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' {
  "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"
# Hook to run a command when a new session is created
}

set-hook -g session-created 'run-shell "if [ #{session_name} = jupyter ]; then tmux send-keys -t #{session_name} '\''cd ~/Drafts && jupyter lab --no-browser > ~/.local/share/jupyter.log 2>&1'\'' C-m; tmux rename-window notebook; tmux new-window; tmux rename-window shell; fi"'
# For fox
if-shell '[ "$(hostname)" = "fox" ]' {
}

